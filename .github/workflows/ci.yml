name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: dsh-mobile-next
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: dsh-mobile-next/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify cordis patch
        run: node scripts/verify-patch.mjs

      - name: Verify client bundle
        run: node scripts/verify-client.mjs

      - name: Verify package
        run: node scripts/verify-package.mjs

  flutter:
    name: Client (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pin the version this project is developed against. An unpinned
          # 'stable' pulled a newer SDK whose deprecation notices (for example
          # package:flutter/material.dart -> package:material_ui/material_ui.dart)
          # turned `flutter analyze` red without any change in our code.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Info-level lints are advisory. Failures are reserved for errors and
      # warnings, so a new SDK's deprecation churn cannot block the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  native:
    name: Native (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The Android crate only builds for Android targets, so host-side checks
      # are limited to the default members (iroh-core + iroh-host).
      - name: Clippy
        run: cargo clippy -p dsh-mobile-iroh-core -p dsh-mobile-iroh-host -- -D warnings

      - name: Test
        run: cargo test -p dsh-mobile-iroh-core -p dsh-mobile-iroh-host

  apk:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: android

      # The .so files are git-ignored (19 MB each), so a plain checkout has no
      # native transport. Gradle will happily build an APK without them and the
      # result crashes at runtime with UnsatisfiedLinkError the first time iroh
      # is used. Cross-compile them here before building the APK.
      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION=28.2.13676358
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          # Accept any pending SDK licenses first. 'yes' is fed through a pipe,
          # so it is killed by SIGPIPE once sdkmanager exits; with pipefail that
          # would fail the step (exit 141), hence the explicit '|| true'.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" < /dev/null > /dev/null

          test -d "${ANDROID_HOME}/ndk/${NDK_VERSION}" \
            || { echo "NDK ${NDK_VERSION} not installed"; exit 1; }
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build native transport (arm64-v8a, x86_64)
        run: |
          set -euo pipefail
          bash native/iroh-android/build-android.sh arm64-v8a
          bash native/iroh-android/build-android.sh x86_64

      - name: Assert native libraries are packaged
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            f="flutter/android/app/src/main/jniLibs/${abi}/libdsh_mobile_iroh_android_transport.so"
            test -f "$f" || { echo "missing $f"; exit 1; }
            echo "ok $f ($(stat -c%s "$f") bytes)"
          done

      # Release signing is opt-in. When the four ANDROID_* secrets are present
      # this job produces a signed release APK; otherwise it falls back to a
      # debug APK so forks and pull requests still get a testable artifact.
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets configured; building a debug APK."
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          KEYSTORE_PATH="${RUNNER_TEMP}/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "storeFile=${KEYSTORE_PATH}"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > flutter/android/key.properties
          # key.properties is git-ignored; assert that before anything else.
          git check-ignore -q flutter/android/key.properties \
            || { echo "key.properties is not git-ignored"; exit 1; }

      - name: Build APK
        working-directory: flutter
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi

      - name: Verify APK contains the native transport
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            APK=flutter/build/app/outputs/flutter-apk/app-release.apk
          else
            APK=flutter/build/app/outputs/flutter-apk/app-debug.apk
          fi
          unzip -l "$APK" | grep -q libdsh_mobile_iroh_android_transport.so \
            || { echo "APK is missing the iroh native library"; exit 1; }
          unzip -l "$APK" | grep libdsh_mobile_iroh_android_transport.so

      - name: Verify APK signature
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            APK=flutter/build/app/outputs/flutter-apk/app-release.apk
          else
            APK=flutter/build/app/outputs/flutter-apk/app-debug.apk
          fi
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  publish:
    name: Publish to npm
    needs: [plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for Trusted Publishing: npm exchanges this OIDC token for a
      # short-lived publish credential, so no NPM_TOKEN secret is needed.
      id-token: write
    defaults:
      run:
        working-directory: dsh-mobile-next
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: dsh-mobile-next/pnpm-lock.yaml

      # Trusted Publishing needs npm >= 11.5; Node 22 bundles npm 10.x.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi
          echo "tag v${TAG} matches package.json"

      # No NODE_AUTH_TOKEN on purpose. With a Trusted Publisher configured on
      # npmjs.com, npm authenticates via the OIDC token and attaches a
      # provenance attestation automatically.
      - name: Publish
        run: npm publish --access public --provenance
