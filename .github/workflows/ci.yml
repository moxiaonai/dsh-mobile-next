name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: dsh-mobile-next
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: dsh-mobile-next/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify cordis patch
        run: node scripts/verify-patch.mjs

      - name: Verify client bundle
        run: node scripts/verify-client.mjs

      - name: Verify package
        run: node scripts/verify-package.mjs

  flutter:
    name: Client (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pin the version this project is developed against. An unpinned
          # 'stable' pulled a newer SDK whose deprecation notices (for example
          # package:flutter/material.dart -> package:material_ui/material_ui.dart)
          # turned `flutter analyze` red without any change in our code.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Info-level lints are advisory. Failures are reserved for errors and
      # warnings, so a new SDK's deprecation churn cannot block the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  native:
    name: Native (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The Android crate only builds for Android targets, so host-side checks
      # are limited to the default members (iroh-core + iroh-host).
      - name: Clippy
        run: cargo clippy -p dsh-mobile-iroh-core -p dsh-mobile-iroh-host -- -D warnings

      - name: Test
        run: cargo test -p dsh-mobile-iroh-core -p dsh-mobile-iroh-host

  apk:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: android

      # The .so files are git-ignored (19 MB each), so a plain checkout has no
      # native transport. Gradle will happily build an APK without them and the
      # result crashes at runtime with UnsatisfiedLinkError the first time iroh
      # is used. Cross-compile them here before building the APK.
      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION=28.2.13676358
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build native transport (arm64-v8a, x86_64)
        run: |
          set -euo pipefail
          bash native/iroh-android/build-android.sh arm64-v8a
          bash native/iroh-android/build-android.sh x86_64

      - name: Assert native libraries are packaged
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            f="flutter/android/app/src/main/jniLibs/${abi}/libdsh_mobile_iroh_android_transport.so"
            test -f "$f" || { echo "missing $f"; exit 1; }
            echo "ok $f ($(stat -c%s "$f") bytes)"
          done

      - name: Build APK
        working-directory: flutter
        run: flutter build apk --debug

      - name: Verify APK contains the native transport
        run: |
          set -euo pipefail
          APK=flutter/build/app/outputs/flutter-apk/app-debug.apk
          unzip -l "$APK" | grep -q libdsh_mobile_iroh_android_transport.so \
            || { echo "APK is missing the iroh native library"; exit 1; }
          unzip -l "$APK" | grep libdsh_mobile_iroh_android_transport.so

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug-apk
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  publish:
    name: Publish to npm
    needs: [plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dsh-mobile-next
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: dsh-mobile-next/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
