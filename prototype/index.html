<!-- App shell: one centered phone column, everything else absolute inside it.
     Fixed-position layers are contained by .app so the desktop frame stays intact. -->
<div class="app" id="app">

  <!-- Tab panels. All three stay mounted (display:none when inactive) so scroll
       position, drafts and half-answered questions survive tab switches
       (brief principle 3 / architecture §5.5). -->
  <div class="app__body" id="tabpanels">
    <section class="tabpanel" id="panel-home" data-tab="home" role="tabpanel" aria-labelledby="tab-home" hidden></section>
    <section class="tabpanel" id="panel-sessions" data-tab="sessions" role="tabpanel" aria-labelledby="tab-sessions" hidden></section>
    <section class="tabpanel" id="panel-devices" data-tab="devices" role="tabpanel" aria-labelledby="tab-devices" hidden></section>
  </div>

  <!-- Bottom tab bar: 3 tabs + center FAB (frozen IA). -->
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="主导航">
    <button class="tabbar__tab" id="tab-home" role="tab" aria-controls="panel-home" aria-selected="true" data-tab="home">
      <svg class="i" aria-hidden="true"><use href="#i-list"></use></svg>
      <span class="tabbar__label">任务</span>
    </button>
    <button class="tabbar__tab" id="tab-sessions" role="tab" aria-controls="panel-sessions" aria-selected="false" data-tab="sessions">
      <svg class="i" aria-hidden="true"><use href="#i-clock"></use></svg>
      <span class="tabbar__label">会话</span>
    </button>
    <div class="tabbar__gap" aria-hidden="true"></div>
    <button class="tabbar__tab" id="tab-devices" role="tab" aria-controls="panel-devices" aria-selected="false" data-tab="devices">
      <svg class="i" aria-hidden="true"><use href="#i-monitor"></use></svg>
      <span class="tabbar__label">设备</span>
    </button>
    <button class="fab" id="fab" aria-label="新建任务">
      <svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg>
    </button>
  </nav>

  <!-- Push surface: task detail / inbox / pairing / diagnostics / appearance.
       A push page replaces the tab bar (UI spec §3.3). -->
  <div class="push" id="push" hidden></div>

  <!-- Shared layers -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet-layer" id="sheet-layer" hidden></div>
  <div class="toast-layer" id="toast-layer" aria-live="polite" aria-atomic="false"></div>
</div>

     from file:// with zero build step, so no ES modules (file:// blocks them). -->

<script src="js/screens/devices.js"></script>

<script src="js/screens/inbox.js"></script>
<script src="js/screens/pairing.js"></script>
<script src="js/screens/settings.js"></script>
<script src="js/app.js"></script>
</body>
